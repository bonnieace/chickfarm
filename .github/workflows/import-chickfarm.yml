name: Import ChickFarm history
on:
  push:
    paths: ['chickfarm-transfer.bundle', '.github/workflows/import-chickfarm.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import prepared ChickFarm history
        env:
          EXPECTED_SHA: 3d976c603cae069d9158148f4f6c74e1fae5834d
          BOOTSTRAP_SHA: ${{ github.sha }}
        run: |
          git bundle verify chickfarm-transfer.bundle
          git fetch ./chickfarm-transfer.bundle main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git show "$BOOTSTRAP_SHA:.github/workflows/import-chickfarm.yml" > /tmp/chickfarm-import.yml
          git checkout --detach "$EXPECTED_SHA"
          cp /tmp/chickfarm-import.yml .github/workflows/import-chickfarm.yml
          git add .github/workflows/import-chickfarm.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Complete standalone ChickFarm history transfer"
          git push origin HEAD:refs/heads/main --force-with-lease="refs/heads/main:$BOOTSTRAP_SHA"
